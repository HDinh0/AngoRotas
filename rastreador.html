<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <title>Rastreador</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #mapa {
            width: 1000px;
            height: 550px;
            margin: auto;
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h1>Olá! Estou no ar.</h1>
    <div id="mapa"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        window.addEventListener("load", () => {
            let map;
            let rotaAtual = null; // guarda a linha atual

            const mapaDiv = document.getElementById("mapa");
            if (!mapaDiv) return;

            // ===============================
            // INICIALIZA MAPA (APENAS UMA VEZ)
            // ===============================
            function initMapa() {

                map = L.map('mapa', {
                    zoomControl: true
                }).setView([-8.9, 13.25], 12);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                // força correção de layout
                setTimeout(() => {
                    map.invalidateSize();
                }, 500);
            }
            initMapa();

            // ===============================
            // OBTEM LOCALIZAÇÃO

            // Opções recomendadas para maior precisão
            const geoOptions = {
                enableHighAccuracy: true,     // ← Mais importante
                maximumAge: 0,                // Não usar cache antigo
                timeout: 10000                // 10 segundos de timeout
            };

            function getPosition(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                console.log(`📍 Latitude: ${lat}`);
                console.log(`📍 Longitude: ${lng}`);
                console.log(`📍 Precisão: ${accuracy.toFixed(2)} metros`);

                // Remover marcadores antigos (se quiser)
                if (window.currentMarker) map.removeLayer(window.currentMarker);
                if (window.currentCircle) map.removeLayer(window.currentCircle);

                // Marcador exato
                window.currentMarker = L.marker([lat, lng], {
                    icon: L.icon({
                        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                    })
                }).addTo(map);

                // Círculo de precisão (só para visualização)
                window.currentCircle = L.circle([lat, lng], {
                    color: '#3388ff',
                    fillColor: '#3388ff',
                    fillOpacity: 0.15,
                    radius: accuracy
                }).addTo(map);

                // Centralizar o mapa com um pequeno zoom
                map.flyTo([lat, lng], accuracy > 100 ? 16 : 18);
            }

            // Função de erro
            function showError(error) {
                console.error("Erro de geolocalização:", error);
                let mensagem = "";

                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        mensagem = "Permissão negada pelo usuário.";
                        break;
                    case error.POSITION_UNAVAILABLE:
                        mensagem = "Localização indisponível.";
                        break;
                    case error.TIMEOUT:
                        mensagem = "Tempo esgotado. Tente novamente.";
                        break;
                    default:
                        mensagem = "Erro desconhecido.";
                }
                alert(mensagem);
            }

            // Chamar a função
            navigator.geolocation.getCurrentPosition(getPosition, showError, geoOptions);
        });
    </script>
</body>
</html>
